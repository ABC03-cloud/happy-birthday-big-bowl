<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Gesture Birthday Game</title>
  
  <!-- MediaPipe CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    .game-container {
      position: relative;
    }
    video {
      display: none; /* Hide raw video feed, we will draw it on canvas */
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      background-color: #000;
      transform: scaleX(-1); /* Mirror the canvas for a natural "selfie" feel */
    }
    #ui-layer {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #FFD700;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 20px #FF4500;
      display: none;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <video id="video-element" autoplay playsinline></video>
    <canvas id="game-canvas" width="640" height="480"></canvas>
    <div id="ui-layer">Score: <span id="score">0</span></div>
    <div id="message">HAPPY BIRTHDAY! 🎂🎉</div>
  </div>

  <script>
    const videoElement = document.getElementById('video-element');
    const canvasElement = document.getElementById('game-canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreElement = document.getElementById('score');
    const messageElement = document.getElementById('message');

    // Game Variables
    let score = 0;
    const winScore = 10;
    let balloons = [];
    let gameActive = true;
    let fingerPos = { x: null, y: null };

    // Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1, // Keep it lightweight by only tracking one hand
      modelComplexity: 0, // 0 is the fastest model, perfect for 2D web interactions
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Handle tracking results
    hands.onResults((results) => {
      // 1. Draw Webcam Feed to Canvas
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      // 2. Track Index Finger (Landmark 8)
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const indexFinger = results.multiHandLandmarks[0][8];
        
        // Convert normalized coordinates (0 to 1) to canvas pixels
        fingerPos.x = indexFinger.x * canvasElement.width;
        fingerPos.y = indexFinger.y * canvasElement.height;

        // Draw a glowing "wand" or "spark" on the index finger
        canvasCtx.beginPath();
        canvasCtx.arc(fingerPos.x, fingerPos.y, 15, 0, 2 * Math.PI);
        canvasCtx.fillStyle = 'rgba(255, 215, 0, 0.8)';
        canvasCtx.fill();
        canvasCtx.lineWidth = 3;
        canvasCtx.strokeStyle = 'white';
        canvasCtx.stroke();
      } else {
        fingerPos = { x: null, y: null };
      }

      // 3. Update & Draw Game Entities
      if (gameActive) {
        updateGameLogic();
      }

      canvasCtx.restore();
    });

    // Basic 2D Game Loop Logic
    function updateGameLogic() {
      // Spawn new balloons randomly
      if (Math.random() < 0.03) {
        balloons.push({
          x: Math.random() * (canvasElement.width - 40) + 20,
          y: -30,
          radius: 25,
          speed: Math.random() * 3 + 2,
          color: `hsl(${Math.random() * 360}, 100%, 60%)`
        });
      }

      // Iterate through balloons backwards to safely remove popped ones
      for (let i = balloons.length - 1; i >= 0; i--) {
        let b = balloons[i];
        b.y += b.speed; // Move balloon down

        // Draw Balloon
        canvasCtx.beginPath();
        canvasCtx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
        canvasCtx.fillStyle = b.color;
        canvasCtx.fill();

        // 2D Collision Detection: Check distance between finger and balloon
        if (fingerPos.x !== null && fingerPos.y !== null) {
          const dx = fingerPos.x - b.x;
          const dy = fingerPos.y - b.y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          // If distance is less than balloon radius + finger radius, it's a POP!
          if (distance < b.radius + 15) {
            balloons.splice(i, 1);
            score++;
            scoreElement.innerText = score;
            
            // Check Win Condition
            if (score >= winScore) {
              gameActive = false;
              messageElement.style.display = 'block';
            }
            continue; // Skip rendering this balloon since it's removed
          }
        }

        // Remove balloons that fall off screen to save memory
        if (b.y > canvasElement.height + b.radius) {
          balloons.splice(i, 1);
        }
      }
    }

    // Connect Camera to MediaPipe
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
